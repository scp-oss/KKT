services:
  kkt-monitor:
    build: .
    image: kkt-monitor:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      DB_PATH: /data/kkt.db
      LISTEN_ADDR: :8080
      # Set to "false" only if you serve this behind plain HTTP without TLS.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - kkt-data:/data

volumes:
  kkt-data:
