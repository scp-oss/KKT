<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Мониторинг ККТ</title>
<link rel="stylesheet" href="/static/style.css">
{{template "head-icons" .}}
</head>
<body>
<div class="login-wrap">
	<div class="card login-card">
		<div class="brand brand-center">{{template "brand-icon" .}}<h2>Мониторинг ККТ</h2></div>
		{{if .Error}}<div class="alert error">Неверный пароль</div>{{end}}
		<form method="post" action="/login">
			<label for="password">Пароль</label>
			<input type="password" id="password" name="password" autofocus required>
			<button class="btn" type="submit" style="width:100%">Войти</button>
		</form>
	</div>
</div>
</body>
</html>
